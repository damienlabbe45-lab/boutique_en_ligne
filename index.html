<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">

        <title>Boutique en ligne</title>

        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="article.css">
        <link rel="stylesheet" href="category.css">
        <link rel="stylesheet" href="cart.css">
        <script src="main.js" defer></script>
    </head>
    <body>
        <header id="shop-header">
            <h1>Boutique FMS</h1>
            <p>Bienvenue sur notre boutique. Ici vous trouverez de tout, que vous soyez riche ou pauvre. Tous nos articles sont satisfait ou satisfait. Nous ne pratiquons pas de remboursement !</p>
        </header>
       
        <div id="cart-container">
            <div class="cart">
                <!-- Contient les articles ajoutés au panier -->
            </div>
            <div id="total-price">Prix total : 0 €</div>
            <button class="cart-button">Payer</button>
        </div>

        <div id="filter-container">
            <div id="category-container">
                <!-- Catégories générées en JS -->
            </div>
            <form id="letters">
                <input type="text" id="input_web"  pattern="[a-zA-Zà-ÿÀ-ŸñÑ\s\d]+" placeholder="Rechercher..."/>
            </form>
        </div>



        <div id="article-container">
            <!-- Articles générés en JS -->
        </div>
    </body>
</html>
